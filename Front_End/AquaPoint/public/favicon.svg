<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="dropGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5fd4f4"/>
      <stop offset="60%" stop-color="#29abe2"/>
      <stop offset="100%" stop-color="#1a8abf"/>
    </radialGradient>
    <radialGradient id="innerCircleGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#a8e8f8"/>
      <stop offset="100%" stop-color="#3db8e0"/>
    </radialGradient>
    <radialGradient id="whiteGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0f0fc"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1a7aaa" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Drop shape -->
  <path
    d="M50 8 C50 8, 20 45, 20 63 C20 80.5 33.5 94 50 94 C66.5 94 80 80.5 80 63 C80 45 50 8 50 8 Z"
    fill="url(#dropGrad)"
    filter="url(#shadow)"
  />

  <!-- Inner teal circle -->
  <circle cx="50" cy="63" r="18" fill="url(#innerCircleGrad)" opacity="0.85"/>

  <!-- White glare circle -->
  <circle cx="50" cy="63" r="9" fill="url(#whiteGlow)"/>

  <!-- Small specular highlight on drop -->
  <ellipse cx="38" cy="38" rx="5" ry="8" fill="white" opacity="0.25" transform="rotate(-20 38 38)"/>
</svg>
