name: aquapoint

services:
  # Proxy: HTTP (frontend + backend) e TCP (base de dados)
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy-logs:/var/log/nginx/shared
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

  backend:
    image: ghcr.io/joaopedro92/aquapoint-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Os backends ligam-se à base de dados através do proxy
      DB_HOST: proxy
      DB_PORT: 3306
    deploy:
      replicas: 3

  frontend:
    image: ghcr.io/joaopedro92/aquapoint-frontend:latest
    restart: unless-stopped
    deploy:
      replicas: 2

  # Painel de monitorização em http://localhost:8081
  # Usa a imagem do backend só porque já traz o Node.js e o mysql2
  monitor:
    image: ghcr.io/joaopedro92/aquapoint-backend:latest
    restart: unless-stopped
    user: root
    command: ["node", "/monitor/server.cjs"]
    environment:
      NODE_PATH: /usr/src/app/node_modules
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8081:4000"
    volumes:
      - ./monitor:/monitor:ro
      - proxy-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock

  # Nó 1 do cluster Galera: cria o cluster e importa o backup.sql
  db1:
    image: mariadb:11.8
    restart: unless-stopped
    hostname: db1
    entrypoint: ["bash", "-c", "tr -d '\\r' < /usr/local/bin/galera-start.sh > /tmp/galera-start.sh && exec bash /tmp/galera-start.sh"]
    environment:
      GALERA_BOOTSTRAP: "1"
      GALERA_PEER: db2
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db1-data:/var/lib/mysql
      - ./galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./galera-start.sh:/usr/local/bin/galera-start.sh:ro
      - ../Back_End/AquaPoint/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -N -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Nó 2 do cluster Galera: junta-se ao db1 e copia os dados dele
  db2:
    image: mariadb:11.8
    restart: unless-stopped
    hostname: db2
    entrypoint: ["bash", "-c", "tr -d '\\r' < /usr/local/bin/galera-start.sh > /tmp/galera-start.sh && exec bash /tmp/galera-start.sh"]
    environment:
      GALERA_BOOTSTRAP: "0"
      GALERA_PEER: db1
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db2-data:/var/lib/mysql
      - ./galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./galera-start.sh:/usr/local/bin/galera-start.sh:ro
    depends_on:
      db1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -N -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  db1-data:
  db2-data:
  proxy-logs:
