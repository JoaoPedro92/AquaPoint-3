name: aquapoint

services:
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    image: ghcr.io/joaopedro92/aquapoint-backend:latest
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      API_PORT: 3000
    deploy:
      replicas: 3
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/joaopedro92/aquapoint-frontend:latest
    deploy:
      replicas: 2

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../Back_End/AquaPoint/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data: