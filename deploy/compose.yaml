name: aquapoint

services:
  proxy:
    image: nginx:alpine
    ports:
      
"8080:80"
  volumes:
./nginx.conf:/etc/nginx/conf.d/default.conf:ro
depends_on:
frontend
backend

  backend:
    image: ghcr.io/joaopedro92/aquapoint-backend:latest
    env_file: .env
    deploy:
      replicas: 3

  frontend:
    image: ghcr.io/joaopedro92/aquapoint-frontend:latest
    deploy:
      replicas: 2