user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

# ---------- HTTP: frontend e backend ----------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    error_log     /var/log/nginx/error.log warn;
    sendfile      on;

    upstream backend_pool {
        server backend:3000;
    }

    upstream frontend_pool {
        server frontend:80;
    }

    server {
        listen 80;

        # Mostra qual réplica respondeu (para demonstrar o balanceamento)
        add_header X-Served-By $upstream_addr always;

        location /api/ {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api-docs {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_set_header Host $host;
        }
    }
}

# ---------- TCP: base de dados (Galera) ----------
stream {
    upstream db_pool {
        # db1 recebe as ligações; db2 só entra se o db1 falhar
        server db1:3306 max_fails=1 fail_timeout=10s;
        server db2:3306 backup;
    }

    server {
        listen 3306;
        proxy_pass db_pool;
        proxy_connect_timeout 2s;
    }
}
