# O Docker resolve "backend" e "frontend" para os IPs de todas as réplicas.
# O nginx distribui os pedidos entre elas (round-robin).
upstream backend_pool {
    server backend:3000;
}

upstream frontend_pool {
    server frontend:80;
}

server {
    listen 80;

    # Mostra qual réplica respondeu (para demonstrar o balanceamento)
    add_header X-Served-By $upstream_addr always;

    # API -> réplicas do backend
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger
    location /api-docs {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
    }

    # Tudo o resto -> réplicas do frontend
    location / {
        proxy_pass http://frontend_pool;
        proxy_set_header Host $host;
    }
}