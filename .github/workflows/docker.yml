name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Back_End
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aquapoint-backend:latest
            ghcr.io/${{ github.repository_owner }}/aquapoint-backend:${{ github.sha }}

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Front_End
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aquapoint-frontend:latest
            ghcr.io/${{ github.repository_owner }}/aquapoint-frontend:${{ github.sha }}